# Archivo de Configuración del Libro
# Aprende más en [https://jupyterbook.org/configure/config.html](https://jupyterbook.org/configure/config.html)

title: Proyecto de prediccion de accidentes (ml3) # Título de tu libro
author: Adriam # Tu nombre o usuario
logo: logo.png # Ya tienes este archivo en ml3/docs/logo.png

# Opciones de ejecución de los notebooks
execute:
  execute_notebooks: 'off' # Opciones: 'auto', 'force', 'cache', 'off'
  # 'off' es más rápido para construir si no necesitas re-ejecutar los notebooks cada vez.
  # 'cache' es bueno para desarrollo, re-ejecuta solo si el código cambia.

# Opciones del Parseador MyST (Markdown)
parse:
  myst_enable_extensions:
    - colon_fence # Permite directivas como ```{note}
    - dollarmath # Para ecuaciones LaTeX con $...$ y $$...$$
    - linkify # Convierte URLs en texto en enlaces
    - substitution # Para definir sustituciones globales
    - tasklist # Para listas de tareas con [ ] y [x]
  myst_url_schemes: [mailto, http, https]

# Opciones HTML
html:
  favicon: logo.png # Opcional: usa tu logo como favicon
  use_edit_page_button: true # Opcional: botón para sugerir ediciones (necesita repo_url)
  use_repository_button: true # Opcional: botón al repositorio (necesita repo_url)
  use_issues_button: true # Opcional: botón para abrir issues (necesita repo_url)
  #baseurl: "" # Si tu sitio está en un subdirectorio en producción (no usual con GitHub Pages y ghp-import)

# Configuración para botones de repositorio (QoL)
repository:
  url: https://github.com/Ansemon/ml3 # URL de tu repositorio
  path_to_book: docs # Ruta a la carpeta del libro dentro del repo
  branch: main # Rama donde están los fuentes del libro

